name: Measure

on:
  push:
    branches: [main]
    paths: ["sites.yml", "webanalyst/**", "requirements.txt", ".github/workflows/measure.yml"]
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      url:
        description: "Ad-hoc URL to test instead of sites.yml (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest -q
          npm test
      - run: python -m playwright install --with-deps firefox chromium
      - name: Run measurements
        env:
          ADHOC_URL: ${{ inputs.url }}
        run: |
          if [ -n "$ADHOC_URL" ]; then
            python -m webanalyst --url "$ADHOC_URL"
          else
            python -m webanalyst
          fi
      - name: Job summary
        run: python -m webanalyst.summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: docs/
      - name: Check Cloudflare secrets
        id: cf
        # Upload is skipped until both secrets exist (Settings -> Secrets and variables -> Actions).
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "enabled=$([ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The frontend deploys separately: Cloudflare Pages builds docs/ from the repo (Git integration).
      - name: Upload new runs to R2
        if: steps.cf.outputs.enabled == 'true'
        continue-on-error: true   # still commit results; re-send missed runs with `python -m webanalyst.publish --all`
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m webanalyst.publish   # before the commit: new runs = untracked files in results/
      - name: Commit results
        run: |
          git config user.name "web-analyst-bot"
          git config user.email "web-analyst-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Measurements $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
