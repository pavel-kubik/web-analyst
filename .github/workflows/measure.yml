name: Measure

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      url:
        description: "Ad-hoc URL to test instead of sites.yml (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps firefox chromium
      - name: Run measurements
        env:
          ADHOC_URL: ${{ inputs.url }}
        run: |
          if [ -n "$ADHOC_URL" ]; then
            python -m webanalyst --url "$ADHOC_URL"
          else
            python -m webanalyst
          fi
      - name: Job summary
        run: python -m webanalyst.summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: docs/
      - name: Commit results
        run: |
          git config user.name "web-analyst-bot"
          git config user.email "web-analyst-bot@users.noreply.github.com"
          git add results docs
          git diff --cached --quiet || git commit -m "Measurements $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
