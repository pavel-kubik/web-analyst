<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Analyst</title>
<!-- Where data/ and shots/ live: the R2 bucket's public URL with a trailing slash. Empty = same origin (local preview). -->
<meta name="data-base" content="https://pub-55869ccb79434b3aa3a8ca444d75daba.r2.dev/">
<!-- TODO: r2.dev is rate-limited and not for production; move to a custom domain (tasks/TODO.md). -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--card:#fff;--line:#e7e5e4;--ok:#15803d;--warn:#b45309;--fail:#b91c1c;--s1:#2563eb;--s2:#93c5fd;--s3:#a8a29e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--card:#292524;--line:#44403c;--ok:#4ade80;--warn:#fbbf24;--fail:#f87171;--s1:#60a5fa;--s2:#1e40af;--s3:#78716c}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--card:#292524;--line:#44403c;--ok:#4ade80;--warn:#fbbf24;--fail:#f87171;--s1:#60a5fa;--s2:#1e40af;--s3:#78716c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600}.muted{color:var(--muted)}a{color:var(--s1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar label{color:var(--muted)}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0 16px}.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.chart{position:relative;height:220px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}td.url{white-space:normal;word-break:break-all;min-width:220px}
th{color:var(--muted);font-weight:600}tr.pick{cursor:pointer}tr.pick:hover td{background:var(--bg)}tr.sel td{background:var(--bg)}
.OK{color:var(--ok)}.WARN{color:var(--warn)}.FAIL{color:var(--fail)}.b{font-weight:700;font-size:12px}
.shots{display:flex;gap:12px;flex-wrap:wrap}.shots figure{margin:0;max-width:320px}.shots img{width:100%;border:1px solid var(--line);border-radius:6px}
figcaption{font-size:12px;color:var(--muted)}ul{margin:4px 0;padding-left:18px}
</style>
</head>
<body>
<main>
  <h1>Web Analyst</h1>
  <p class="muted">Landing-page health from daily measurements: status codes, latency and browser-check interstitials.</p>
  <div class="bar">
    <label>Window <select id="days"><option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">1 year</option></select></label>
    <label>Bucket <select id="bucket"><option value="day">day</option><option value="week">week</option></select></label>
  </div>
  <div id="app"><p class="muted">Loading…</p></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="app.js"></script>
</body>
</html>
